# tmux config for a vim user. Shared by Linux and macOS.
# Linked to ~/.tmux.conf by scripts/link.sh. Plugins and TPM are installed by scripts/install/tmux.sh.
# Needs tmux >= 3.2.
#
# Finding shortcuts:
#   prefix ?        every binding with a note (all custom ones below have -N notes)
#   prefix Space    which-key style popup menu (tmux-which-key)
#
# Prefix is C-a. Press C-a twice to send a literal C-a (start of line in the shell).
# C-Space is left alone so nvim completion keeps working.

# ---------- Core ----------
unbind C-b
set -g prefix C-a
bind -N "Send C-a to the app" C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g escape-time 10          # vim: no lag after <Esc>
set -g focus-events on         # vim: autoread / FocusGained
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on        # copy through OSC 52: works locally and over SSH, no xclip needed
set -g allow-passthrough on    # let nvim/images talk to the terminal
set -g detach-on-destroy off   # closing the last window of a session switches to another session
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#S / #W"

# Number windows and panes from 1 to match the keyboard, and close gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi keys in copy mode. The command prompt (prefix :) stays emacs style, which is easier there.
setw -g mode-keys vi
set -g status-keys emacs

# Machine-specific overrides, not in dotfiles
if-shell "test -f ~/.tmux.local.conf" "source-file ~/.tmux.local.conf"

# ---------- Reload ----------
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ---------- Splits & windows (open in the current directory) ----------
bind -N "Split right"            | split-window -h -c "#{pane_current_path}"
bind -N "Split right"           \\ split-window -h -c "#{pane_current_path}"
bind -N "Split down"             - split-window -v -c "#{pane_current_path}"
bind -N "New window"             c new-window -c "#{pane_current_path}"
bind -N "Swap window left"   -r  < swap-window -t -1 \; select-window -t -1
bind -N "Swap window right"  -r  > swap-window -t +1 \; select-window -t +1
bind -N "Last window"       Tab  last-window

# ---------- Panes (vim keys) ----------
# C-h/j/k/l without a prefix move across tmux panes AND nvim splits (vim-tmux-navigator).
# prefix + h/j/k/l is the fallback, e.g. when C-l is needed to clear the screen.
bind -N "Pane left"          h select-pane -L
bind -N "Pane down"          j select-pane -D
bind -N "Pane up"            k select-pane -U
bind -N "Pane right"         l select-pane -R
bind -N "Resize pane left"  -r H resize-pane -L 5
bind -N "Resize pane down"  -r J resize-pane -D 3
bind -N "Resize pane up"    -r K resize-pane -U 3
bind -N "Resize pane right" -r L resize-pane -R 5
bind -N "Zoom pane"          z resize-pane -Z
bind -N "Kill pane"          x kill-pane
bind -N "Clear screen (C-l is pane navigation)" C-l send-keys C-l

# ---------- Sessions ----------
bind -N "Pick session/window (tree)" s choose-tree -Zs
bind -N "New session"                N command-prompt -p "New session name:" "new-session -s '%%' -c '#{pane_current_path}'"

# ---------- Copy mode (vim) ----------
bind -N "Enter copy mode" Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ---------- Plugins (TPM) ----------
# Install / update: prefix I / prefix U (or scripts/install/tmux.sh)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across tmux + nvim (nvim side: nvim/lua/custom/plugins/tmux-navigator.lua)
set -g @plugin 'alexwforsythe/tmux-which-key'      # prefix Space: popup menu of everything
set -g @plugin 'catppuccin/tmux#v2.3.2'            # matches Ghostty / nvim / starship

# Theme: catppuccin mocha, status bar on top
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=red bold] PREFIX ,}#{E:@catppuccin_status_session}"

# Must stay at the very bottom
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
