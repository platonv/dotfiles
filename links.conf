# Symlink manifest: <path in repo>  <target on this machine>
# Read by scripts/link.sh. Targets support ~. Lines starting with # are ignored.
# Optional third column limits a link to one OS: linux | macos
#
# To add a config: move it into the repo, add a line here, run scripts/link.sh.

zsh/zshrc                    ~/.zshrc
zsh/zshenv                   ~/.zshenv
git/gitconfig                ~/.gitconfig
git/ignore                   ~/.config/git/ignore
ghostty/config.ghostty       ~/.config/ghostty/config.ghostty
nvim                         ~/.config/nvim
zed/settings.json            ~/.config/zed/settings.json
ai/claude/CLAUDE.md          ~/.claude/CLAUDE.md
ai/claude/settings.json      ~/.claude/settings.json
