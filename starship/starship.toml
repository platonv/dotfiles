# Starship prompt (https://starship.rs/config/)
# Linked to ~/.config/starship.toml by scripts/link.sh. Installed by scripts/install/starship.sh.
# Catppuccin Mocha palette to match Ghostty and nvim. Needs a Nerd Font (JetBrainsMono Nerd Font).
#
# Layout:  ~/dir  branch ±status ······ lang versions · duration
#          ❯
#
# The format is an explicit allow-list: cloud/k8s modules (aws, gcloud, azure,
# kubernetes) are left out so account or cluster names never show up in screenshots.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 800
palette = "catppuccin_mocha"

format = """
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$python\
$conda\
$golang\
$rust\
$java\
$scala\
$terraform\
$docker_context\
$cmd_duration\
$line_break\
$jobs\
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Only shown over SSH, so you know which box you're on.
[hostname]
ssh_only = true
format = "[$ssh_symbol$hostname]($style) "
ssh_symbol = " "
style = "bold peach"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
stashed = "≡"

[git_state]
style = "bold peach"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ $duration]($style) "

[jobs]
symbol = "✦ "
style = "bold teal"

# ---------- Languages: only shown inside matching projects ----------
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol$pyenv_prefix($version)( \\($virtualenv\\))]($style) "

[conda]
symbol = "🅒 "
style = "green"
ignore_base = true
format = "[$symbol$environment]($style) "

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

[scala]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

[terraform]
symbol = "󱁢 "
style = "lavender"
format = "[$symbol$workspace]($style) "

[docker_context]
symbol = " "
style = "blue"
only_with_files = true
format = "[$symbol$context]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
